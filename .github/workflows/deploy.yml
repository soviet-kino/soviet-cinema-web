name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Один деплой на main — без параллельных.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout web
        uses: actions/checkout@v4

      - name: Checkout soviet-cinema-data (main)
        uses: actions/checkout@v4
        with:
          repository: soviet-kino/soviet-cinema-data
          ref: main
          path: data-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build static site
        env:
          SBC_DATA_DIR: ${{ github.workspace }}/data-source
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://soviet-cinema.pages.dev' }}
        run: npm run build

      # Cloudflare Pages free tier режет деплой на 20 000 файлах.
      # Next.js генерирует .txt (RSC payload) на каждую html-страницу,
      # удваивая счётчик. Удаляем .txt — Link-навигация откатится на
      # full page reload, что приемлемо.
      - name: Trim RSC .txt files (CFP 20k file limit)
        run: |
          before=$(find out -type f | wc -l)
          # -type f важен: в out/ есть директории с именами вроде
          # robots.txt/, sitemap.xml/ — их трогать нельзя.
          find out -type f -name "*.txt" -delete
          after=$(find out -type f | wc -l)
          echo "Файлов до: $before · после: $after"

      # wrangler pages deploy не создаёт проект сам — нужно сделать это
      # один раз. Делаем через прямой shell-вызов, чтобы корректно
      # игнорировать ошибку «already exists» при повторных запусках.
      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@3 pages project create soviet-cinema \
            --production-branch=main || true

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=soviet-cinema --branch=main --commit-dirty=true
